name: guard-index
on:
  push:
    branches: [main, Dev]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html must still be the full app
        run: |
          size=$(wc -c < index.html)
          echo "index.html size: $size bytes"
          if [ "$size" -lt 200000 ]; then
            echo "::error::index.html is only $size bytes. A design-only file probably replaced the app."
            exit 1
          fi
          for needle in "function renderFlight" "function renderPassports" "const FLIGHT_PROXY"; do
            grep -q "$needle" index.html || { echo "::error::missing '$needle' in index.html"; exit 1; }
          done
