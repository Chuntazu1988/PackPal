<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackPal – רשימת אריזה לטיול</title>
<style>
  /* ===== צבעים ===== */
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #1f2a37;
    --muted: #6b7785;
    --accent: #2f80ed;
    --accent-dark: #1c5fc0;
    --ok: #27ae60;
    --danger: #e5484d;
    --border: #dde4ec;
    --soft: #eaf1fb;      /* רקע בהיר לכפתורים משניים */
    --stat: #eef4fc;      /* רקע לנתוני מזג האוויר */
    --track: #e6ecf3;     /* רקע פס ההתקדמות */
    --shadow: rgba(0,0,0,.06);
    color-scheme: light;
  }
  /* מצב כהה: מחליפים רק את המשתנים, וכל האתר משתנה לבד */
  :root[data-theme="dark"] {
    --bg: #12171f;
    --card: #1c2430;
    --text: #e8edf3;
    --muted: #9aa7b6;
    --accent: #4c98ff;
    --accent-dark: #8bbcff;
    --border: #2f3b4a;
    --soft: #26354a;
    --stat: #243142;
    --track: #2b3746;
    --shadow: rgba(0,0,0,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { margin: 8px 0 4px; font-size: 1.8rem; }
  h1 small { display: block; font-size: 0.95rem; color: var(--muted); font-weight: normal; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin: 14px 0;
    box-shadow: 0 2px 10px var(--shadow);
  }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], input[type=date] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }

  /* ===== כפתורי פעילויות ===== */
  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 6px; }
  .chip input { display: none; }
  .chip { margin: 0; font-weight: normal; }
  .chip span {
    display: block;
    text-align: center;
    padding: 10px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    transition: all .15s;
  }
  .chip input:checked + span {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: scale(1.05);
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
  }
  .primary { background: var(--accent); color: #fff; width: 100%; margin-top: 16px; font-weight: 600; }
  .primary:hover { background: var(--accent-dark); }
  .primary:disabled { opacity: .6; cursor: wait; }
  .secondary { background: var(--soft); color: var(--accent-dark); }
  .whatsapp { background: #25d366; color: #fff; }

  #error { color: var(--danger); margin-top: 10px; min-height: 1.2em; }

  /* ===== מזג אוויר ===== */
  #weather .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .stat { background: var(--stat); border-radius: 10px; padding: 6px 12px; font-size: .95rem; }
  .note { color: var(--muted); font-size: .85rem; margin-top: 8px; }

  /* ===== התקדמות ===== */
  .bar { height: 14px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; width: 0; background: var(--ok); transition: width .4s ease; }

  /* ===== הרשימה ===== */
  .cat-title { margin: 18px 0 6px; font-size: 1.05rem; color: var(--accent-dark); }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    animation: pop .25s ease;
  }
  .item input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ok); cursor: pointer; }
  .item .text { flex: 1; transition: all .2s; }
  .item.done .text { text-decoration: line-through; color: var(--muted); }
  .item .del { background: none; color: var(--danger); padding: 4px 8px; font-size: 1.1rem; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .add-row { display: flex; gap: 8px; margin-top: 14px; }
  .add-row input { flex: 1; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .actions button { flex: 1; }

  /* ===== טיולים קודמים ===== */
  .past-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .past-row .info { flex: 1; }
  .past-row .info small { display: block; color: var(--muted); }
  .past-row .del { background: none; color: var(--danger); padding: 4px 8px; font-size: 1.1rem; }

  .trip-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .trip-title h2 { margin: 0; font-size: 1.3rem; flex: 1; }
  .trip-title .rename-btn, .past-row .rename-btn { background: none; padding: 4px 8px; font-size: 1.1rem; }
  .rename-form { display: flex; gap: 8px; align-items: center; flex: 1; }
  .rename-form input { flex: 1; }
  .past-row + .rename-form { padding: 6px 4px 14px; border-bottom: 1px solid var(--border); }
  .past-head { display: flex; align-items: center; gap: 8px; }
  .past-head strong { flex: 1; }
  .past-head button { padding: 6px 12px; font-size: .9rem; }
  .danger-btn { background: var(--danger); color: #fff; }
  .choices { margin-top: 8px; }
  .choices .hint { color: var(--muted); font-size: .9rem; margin-bottom: 6px; }
  .choices button { display: block; width: 100%; text-align: start; margin-top: 6px; background: var(--soft); color: var(--text); border: 1px solid var(--border); }
  .choices button small { color: var(--muted); }
  .dup-form { padding: 6px 4px 14px; border-bottom: 1px solid var(--border); }
  .dup-form .primary { margin-top: 0; }
  .dup-error { color: var(--danger); min-height: 1.2em; margin-top: 6px; }

  /* ===== באנר גרסת פיתוח ===== */
  #devBanner {
    background: repeating-linear-gradient(45deg, #ff6b00, #ff6b00 20px, #ffb300 20px, #ffb300 40px);
    color: #fff;
    text-align: center;
    font-size: 1.6rem;
    font-weight: 800;
    padding: 18px 12px;
    text-shadow: 0 2px 4px rgba(0,0,0,.45);
    border-bottom: 6px solid #d90429;
    letter-spacing: 1px;
  }
  #devBanner small { display: block; font-size: 1rem; font-weight: 600; }

  #themeBtn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 20;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .hidden { display: none; }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
</style>
</head>
<body>
<div id="devBanner" class="hidden">
  🚧 גרסת פיתוח (DEV) 🚧
  <small>זו לא הגרסה הסופית – כאן מנסים דברים חדשים</small>
</div>
<button type="button" id="themeBtn" aria-label="החלף מצב כהה / בהיר"></button>
<main>
  <h1>🧳 PackPal <small>רשימת אריזה חכמה לפי מזג האוויר והפעילויות שלך</small></h1>

  <!-- ===== טופס הטיול ===== -->
  <form id="tripForm" class="card" autocomplete="off">
    <label for="destination">לאן נוסעים?</label>
    <input type="text" id="destination" placeholder="עיר או מדינה, למשל: פריז או ספרינגפילד, אילינוי" required>
    <div id="placeChoices" class="choices hidden" role="group" aria-label="בחרי את המקום הנכון"></div>

    <div class="row">
      <div>
        <label for="startDate">מתאריך</label>
        <input type="date" id="startDate" required>
      </div>
      <div>
        <label for="endDate">עד תאריך</label>
        <input type="date" id="endDate" required>
      </div>
    </div>

    <label>מה מתכננים לעשות?</label>
    <div class="chips" id="activities"></div>

    <button type="submit" class="primary" id="goBtn">בנה לי רשימה</button>
    <div id="error" role="alert"></div>
  </form>

  <!-- ===== מזג אוויר ===== -->
  <section id="weather" class="card hidden"></section>

  <!-- ===== הרשימה ===== -->
  <section id="listSection" class="card hidden">
    <div id="tripTitle" class="trip-title"></div>
    <strong id="progressText"></strong>
    <div class="bar"><div id="barFill"></div></div>
    <div id="list"></div>

    <form class="add-row" id="addForm" autocomplete="off">
      <input type="text" id="newItem" placeholder="הוסף פריט משלך...">
      <button type="submit" class="secondary">הוסף</button>
    </form>

    <div class="actions">
      <button type="button" class="whatsapp" id="shareBtn">שתף בוואטסאפ</button>
      <button type="button" class="secondary" id="resetBtn">טיול חדש</button>
    </div>
  </section>

  <!-- ===== טיולים קודמים ===== -->
  <section id="pastSection" class="card hidden"></section>
</main>

<canvas id="confetti"></canvas>

<script>
/* =========================================================
   1. נתונים קבועים
   ========================================================= */

// הפעילויות שאפשר לבחור (המפתח הוא שם פנימי, ה-label מוצג למשתמש)
const ACTIVITIES = {
  beach:    '🏖️ חוף וים',
  hiking:   '🥾 טיולי הליכה',
  ski:      '⛷️ סקי',
  city:     '🏙️ סיורים בעיר',
  business: '💼 עבודה / פגישות',
  camping:  '⛺ קמפינג',
  fancy:    '🍷 מסעדות וערבים',
  snorkel:  '🤿 שנורקלינג / צלילה',
  cycling:  '🚴 רכיבה על אופניים',
  running:  '🏃 ריצה / ספורט',
  spa:      '🧖 ספא ומנוחה',
  photo:    '📸 צילום',
  kids:     '👶 טיול עם ילדים',
  roadtrip: '🚗 טיול רכב'
};

// ⚠️ מתג גרסת פיתוח:
// true  = מוצג באנר גדול וצבעוני למעלה (בענף Dev)
// false = בלי באנר (בענף main, הגרסה הסופית)
// כשמעבירים את Dev ל-main – לא לשכוח להחליף ל-false!
const IS_DEV = true;

if (IS_DEV) {
  document.getElementById('devBanner').classList.remove('hidden');
  document.title = '[DEV] ' + document.title;
}

// אחסון נפרד לגרסת פיתוח, כדי שנתוני בדיקה לא יתערבבו עם הגרסה הסופית
const STORAGE_KEY = IS_DEV ? 'packpal-v1-dev' : 'packpal-v1';

/* =========================================================
   1ב. מצב כהה / בהיר
   ========================================================= */

const THEME_KEY = 'packpal-theme';

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;          // CSS מגיב ל-data-theme
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️ בהיר' : '🌙 כהה';
}

// בוחרים: מה ששמרנו בפעם הקודמת, ואם אין – מה שמוגדר במכשיר
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
applyTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
});

/* =========================================================
   2. שמירה בטלפון (localStorage)
   ========================================================= */

// state = כל מה שהאפליקציה זוכרת: פרטי הטיול, מזג האוויר והפריטים
let state = null;

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* אם אין אחסון – ממשיכים בלי */ }
}
function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
}

// טיולים קודמים: רשימה נפרדת, החדש ביותר ראשון
const HISTORY_KEY = STORAGE_KEY + '-history';
const HISTORY_MAX = 20;

function loadHistory() {
  try {
    const h = JSON.parse(localStorage.getItem(HISTORY_KEY));
    return Array.isArray(h) ? h : [];
  } catch (e) { return []; }
}
function saveHistory(h) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_MAX))); } catch (e) {}
}

/* =========================================================
   3. מזג אוויר – Open-Meteo (חינמי, בלי מפתח)
   ========================================================= */

// תאריך כמחרוזת YYYY-MM-DD (לפי שעון מקומי)
function toISO(d) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}
function parseISO(s) { return new Date(s + 'T12:00:00'); }

// שם יפה למקום: עיר, אזור (אם יש ושונה מהעיר), מדינה (אם שונה מהשם)
function placeLabel(p) {
  const parts = [p.name];
  if (p.admin1 && p.admin1 !== p.name) parts.push(p.admin1);
  if (p.country && p.country !== p.name) parts.push(p.country);
  return parts.join(', ');
}

// מחפש מקומות לפי שם. אפשר לכתוב גם "עיר, מדינה" או "עיר, מחוז" כדי לצמצם.
async function geocodeAll(text) {
  const parts = text.split(',').map(x => x.trim()).filter(Boolean);
  const name = parts[0] || text.trim();
  const hints = parts.slice(1).map(h => h.toLowerCase());

  const url = 'https://geocoding-api.open-meteo.com/v1/search?count=10&language=he&name=' + encodeURIComponent(name);
  const res = await fetch(url);
  if (!res.ok) throw new Error('שגיאה בחיפוש היעד');
  const data = await res.json();
  let results = data.results || [];
  if (hints.length) {
    const narrowed = results.filter(p => {
      const hay = [p.country, p.admin1, p.admin2, p.country_code].filter(Boolean).join(' ').toLowerCase();
      return hints.every(h => hay.includes(h));
    });
    if (narrowed.length) results = narrowed;
  }
  if (!results.length) throw new Error('לא מצאתי את היעד "' + text + '". נסי שם אחר או באנגלית.');
  // הגדולים קודם – בדרך כלל זה מה שהתכוונו אליו
  results.sort((x, y) => (y.population || 0) - (x.population || 0));
  return results.map(p => ({ lat: p.latitude, lon: p.longitude, label: placeLabel(p), country: p.country, admin1: p.admin1, population: p.population }));
}

// מוצא קואורדינטות של היעד (התוצאה הראשונה)
async function geocode(name) {
  return (await geocodeAll(name))[0];
}

// מקבל תחזית (עד 16 יום קדימה) או ממוצע משנה שעברה
async function getWeather(place, startISO, endISO) {
  const today = new Date();
  const limit = new Date(today);
  limit.setDate(limit.getDate() + 15);

  let daily, source;
  if (parseISO(endISO) <= limit) {
    // הטיול קרוב – תחזית אמיתית
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + place.lat + '&longitude=' + place.lon +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max' +
      '&timezone=auto&start_date=' + startISO + '&end_date=' + endISO;
    const res = await fetch(url);
    if (!res.ok) throw new Error('שגיאה בקבלת התחזית');
    daily = (await res.json()).daily;
    source = 'forecast';
  } else {
    // הטיול רחוק – אותם תאריכים בשנה שעברה
    const s = parseISO(startISO); s.setFullYear(s.getFullYear() - 1);
    const e = parseISO(endISO);   e.setFullYear(e.getFullYear() - 1);
    const url = 'https://archive-api.open-meteo.com/v1/archive?latitude=' + place.lat + '&longitude=' + place.lon +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max' +
      '&timezone=auto&start_date=' + toISO(s) + '&end_date=' + toISO(e);
    const res = await fetch(url);
    if (!res.ok) throw new Error('שגיאה בקבלת נתוני מזג אוויר היסטוריים');
    daily = (await res.json()).daily;
    source = 'history';
  }
  return summarize(daily, source);
}

// הופך רשימת ימים לסיכום קצר: הכי קר, הכי חם, ימי גשם, רוח חזקה
function summarize(daily, source) {
  const clean = arr => (arr || []).filter(v => v !== null && v !== undefined);
  const mins = clean(daily.temperature_2m_min);
  const maxs = clean(daily.temperature_2m_max);
  const winds = clean(daily.wind_speed_10m_max);
  if (!mins.length || !maxs.length) throw new Error('אין נתוני מזג אוויר לתאריכים האלה');

  let rainyDays = 0;
  if (source === 'forecast') {
    rainyDays = clean(daily.precipitation_probability_max).filter(p => p >= 50).length;
  } else {
    rainyDays = clean(daily.precipitation_sum).filter(mm => mm >= 1).length;
  }
  return {
    source: source,
    minTemp: Math.round(Math.min(...mins)),
    maxTemp: Math.round(Math.max(...maxs)),
    rainyDays: rainyDays,
    maxWind: winds.length ? Math.round(Math.max(...winds)) : 0
  };
}

/* =========================================================
   4. בניית רשימת האריזה
   ========================================================= */

// הקטגוריה של פריטים שהמשתמשת הוסיפה בעצמה
const CUSTOM_CAT = '✏️ שלי';

let nextId = 1;
function makeItem(text, cat) {
  return { id: nextId++, text: text, cat: cat, checked: false };
}

function buildList(trip, w) {
  const items = [];
  const add = (cat, text) => items.push(makeItem(text, cat));

  const days = Math.round((parseISO(trip.end) - parseISO(trip.start)) / 86400000) + 1;
  const acts = trip.activities;

  // --- מסמכים ---
  add('📄 מסמכים וכסף', 'דרכון / תעודת זהות');
  add('📄 מסמכים וכסף', 'כרטיסי טיסה והזמנות');
  add('📄 מסמכים וכסף', 'כרטיס אשראי ומזומן');
  add('📄 מסמכים וכסף', 'ביטוח נסיעות');

  // --- אלקטרוניקה ---
  add('🔌 אלקטרוניקה', 'טלפון + מטען');
  add('🔌 אלקטרוניקה', 'מטען נייד');
  add('🔌 אלקטרוניקה', 'מתאם לחשמל');
  add('🔌 אלקטרוניקה', 'אוזניות');

  // --- היגיינה ---
  add('🧴 היגיינה ובריאות', 'מברשת ומשחת שיניים');
  add('🧴 היגיינה ובריאות', 'דאודורנט ושמפו');
  add('🧴 היגיינה ובריאות', 'תרופות אישיות');
  add('🧴 היגיינה ובריאות', 'תרופות בסיסיות (משככי כאבים, פלסטרים)');

  // --- בגדים בסיסיים (הכמות לפי מספר הימים) ---
  const pairs = Math.min(days + 1, 10);
  add('👕 בגדים', pairs + ' זוגות תחתונים');
  add('👕 בגדים', pairs + ' זוגות גרביים');
  add('👕 בגדים', Math.min(days, 8) + ' חולצות');
  add('👕 בגדים', 'מכנסיים ארוכים (2-3)');
  add('👕 בגדים', 'פיג\'מה');
  add('👕 בגדים', 'נעליים נוחות');

  // --- לפי טמפרטורה ---
  if (w.minTemp < 0) {

/* =========================================================
   5. הצגה על המסך
   ========================================================= */

const $ = id => document.getElementById(id);

// עוזר קטן ליצירת אלמנט. משתמש ב-textContent כדי שטקסט של משתמש לא יוכל להזריק קוד.
function el(tag, props, text) {
  const e = document.createElement(tag);
  if (props) Object.assign(e, props);
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderWeather() {
  const box = $('weather');
  box.replaceChildren();
  if (!state) { box.classList.add('hidden'); return; }
  const w = state.weather, t = state.trip;

  box.appendChild(el('strong', null, '🌤️ מזג האוויר ב' + t.place));
  const stats = el('div', { className: 'stats' });
  stats.appendChild(el('span', { className: 'stat' }, '🌡️ ' + w.minTemp + '° עד ' + w.maxTemp + '°'));
  stats.appendChild(el('span', { className: 'stat' }, '🌧️ ' + w.rainyDays + ' ימי גשם'));
  stats.appendChild(el('span', { className: 'stat' }, '💨 רוח עד ' + w.maxWind + ' קמ"ש'));
  box.appendChild(stats);
  box.appendChild(el('div', { className: 'note' },
    w.source === 'forecast'
      ? 'תחזית אמיתית לתאריכי הטיול.'
      : 'הטיול רחוק, אז זה ממוצע של אותם תאריכים בשנה שעברה.'));
  box.classList.remove('hidden');
}

// השם שמוצג לטיול: שם שהמשתמשת נתנה, ואם אין – שם היעד
function tripName(t) { return t.name || t.place; }

// טופס קטן לשינוי שם (שדה טקסט + שמור + ביטול)
function renderRenameForm(t, onSave, onCancel) {
  const form = el('form', { className: 'rename-form' });
  const input = el('input', { type: 'text', value: tripName(t), maxLength: 60 });
  input.setAttribute('aria-label', 'שם הטיול');
  input.placeholder = t.place;
  const save = el('button', { type: 'submit', className: 'secondary' }, 'שמור');
  const cancel = el('button', { type: 'button', className: 'secondary' }, 'ביטול');
  cancel.addEventListener('click', onCancel);
  form.append(input, save, cancel);
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const name = input.value.trim();
    // שם ריק או זהה ליעד = חוזרים לשם ברירת המחדל
    onSave(name && name !== t.place ? name : '');
  });
  setTimeout(() => input.focus(), 0);
  return form;
}

let renamingCurrent = false;

function renderTitle() {
  const box = $('tripTitle');
  box.replaceChildren();
  if (renamingCurrent) {
    box.appendChild(renderRenameForm(state.trip,
      (name) => { setTripName(state.trip, name); renamingCurrent = false; save(); renderList(); },
      () => { renamingCurrent = false; renderTitle(); }));
    return;
  }
  const btn = el('button', { type: 'button', className: 'rename-btn', title: 'שנה שם' }, '✏️');
  btn.setAttribute('aria-label', 'שנה את שם הטיול');
  btn.addEventListener('click', () => { renamingCurrent = true; renderTitle(); });
  box.append(el('h2', null, tripName(state.trip)), btn);
}

function setTripName(trip, name) {
  if (name) trip.name = name; else delete trip.name;
}

function renderList() {
  const section = $('listSection');
  if (!state) { section.classList.add('hidden'); return; }
  section.classList.remove('hidden');
  renderTitle();

  const list = $('list');
  list.replaceChildren();

  // מקבצים את הפריטים לפי קטגוריה
  const groups = {};
  state.items.forEach(it => { (groups[it.cat] = groups[it.cat] || []).push(it); });

  Object.keys(groups).forEach(cat => {
    list.appendChild(el('h3', { className: 'cat-title' }, cat));
    groups[cat].forEach(it => {
      const row = el('div', { className: 'item' + (it.checked ? ' done' : '') });
      const box = el('input', { type: 'checkbox', checked: it.checked });
      box.setAttribute('aria-label', it.text);
      box.addEventListener('change', () => toggleItem(it.id));
      const del = el('button', { type: 'button', className: 'del', title: 'מחק' }, '✕');
      del.addEventListener('click', () => deleteItem(it.id));
      row.append(box, el('span', { className: 'text' }, it.text), del);
      list.appendChild(row);
    });
  });
  renderProgress();
}

function fmtDate(iso) {
  return iso.split('-').reverse().join('/');
}

function renderPast() {
  const box = $('pastSection');
  box.replaceChildren();
  const hist = loadHistory();
  if (!hist.length) { confirmClearAll = false; box.classList.add('hidden'); return; }

  const head = el('div', { className: 'past-head' });
  head.appendChild(el('strong', null, '🗂️ טיולים קודמים'));
  if (confirmClearAll) {
    const yes = el('button', { type: 'button', className: 'danger-btn' }, 'כן, למחוק ' + hist.length + ' טיולים');
    yes.addEventListener('click', clearAllPast);
    const no = el('button', { type: 'button', className: 'secondary' }, 'ביטול');
    no.addEventListener('click', () => { confirmClearAll = false; renderPast(); });
    head.append(yes, no);
  } else {
    const all = el('button', { type: 'button', className: 'secondary' }, 'מחק הכל');
    all.addEventListener('click', () => { confirmClearAll = true; dupOpenIdx = null; renameOpenIdx = null; renderPast(); });
    head.appendChild(all);
  }
  box.appendChild(head);
  hist.forEach((entry, idx) => {
    const t = entry.trip, total = entry.items.length;
    const done = entry.items.filter(i => i.checked).length;
    const row = el('div', { className: 'past-row' });
    const info = el('div', { className: 'info' });
    info.appendChild(el('span', null, tripName(t)));
    info.appendChild(el('small', null,
      (t.name ? t.place + ' · ' : '') + fmtDate(t.start) + ' – ' + fmtDate(t.end) + ' · ארזת ' + done + ' מתוך ' + total));
    const openBtn = el('button', { type: 'button', className: 'secondary' }, 'פתח');
    openBtn.addEventListener('click', () => openPastTrip(idx));
    const renameBtn = el('button', { type: 'button', className: 'rename-btn', title: 'שנה שם' }, '✏️');
    renameBtn.setAttribute('aria-label', 'שנה את שם הטיול');
    renameBtn.addEventListener('click', () => { renameOpenIdx = renameOpenIdx === idx ? null : idx; dupOpenIdx = null; confirmClearAll = false; renderPast(); });
    const dupBtn = el('button', { type: 'button', className: 'secondary' }, 'שכפל');
    dupBtn.title = 'טיול חדש לאותו יעד, בתאריכים אחרים';
    dupBtn.addEventListener('click', () => { dupOpenIdx = dupOpenIdx === idx ? null : idx; renameOpenIdx = null; confirmClearAll = false; renderPast(); });
    const del = el('button', { type: 'button', className: 'del', title: 'מחק' }, '✕');
    del.addEventListener('click', () => deletePastTrip(idx));
    row.append(info, openBtn, dupBtn, renameBtn, del);
    box.appendChild(row);
    if (renameOpenIdx === idx) {
      box.appendChild(renderRenameForm(t,
        (name) => {
          const h = loadHistory();
          setTripName(h[idx].trip, name);
          saveHistory(h);
          renameOpenIdx = null;
          renderPast();
        },
        () => { renameOpenIdx = null; renderPast(); }));
    }
    if (dupOpenIdx === idx) box.appendChild(renderDupForm(idx));
  });
  box.classList.remove('hidden');
}

// שומר את הטיול הנוכחי (אם יש) בראש רשימת הטיולים הקודמים
function archiveCurrentTrip() {
  if (!state || !state.items) return;
  const hist = loadHistory();
  hist.unshift(state);
  saveHistory(hist);
}

function openPastTrip(idx) {
  const hist = loadHistory();
  const trip = hist.splice(idx, 1)[0];
  if (!trip) return;
  dupOpenIdx = null;
  renameOpenIdx = null;
  saveHistory(hist);
  archiveCurrentTrip();
  state = trip;
  save();
  applyStateToPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// האם מחכים לאישור "מחק הכל" בכרטיס הטיולים הקודמים
let confirmClearAll = false;

function clearAllPast() {
  confirmClearAll = false;
  dupOpenIdx = null;
  renameOpenIdx = null;
  saveHistory([]);
  renderPast();
}

// איזה טיול ישן פתוח כרגע לשכפול (מציג שדות תאריך מתחתיו), או null
let dupOpenIdx = null;
// איזה טיול ישן פתוח כרגע לשינוי שם, או null
let renameOpenIdx = null;

// יוצר טיול חדש מעותק של טיול ישן, עם תאריכים חדשים:
// אותו יעד ואותן פעילויות, מזג אוויר מעודכן, רשימה חדשה לפי התאריכים,
// ועליה הפריטים האישיים שהוספת בטיול הישן. הטיול הישן נשאר ברשימה.
async function duplicatePastTrip(idx, start, end) {
  const source = loadHistory()[idx];
  if (!source) return;

  const old = source.trip;
  let place = { lat: old.lat, lon: old.lon, label: old.place };
  if (place.lat === undefined || place.lon === undefined) {
    // טיול ישן שנשמר בלי קואורדינטות – מחפשים לפי שם היעד (בלי שם המדינה)
    place = await geocode(old.place.split(', ')[0]);
    place.label = old.place;
  }
  const weather = await getWeather(place, start, end);
  const trip = { place: old.place, lat: place.lat, lon: place.lon, start: start, end: end, activities: old.activities };

  nextId = 1;
  const items = buildList(trip, weather);
  source.items.filter(it => it.cat === CUSTOM_CAT).forEach(it => items.push(makeItem(it.text, CUSTOM_CAT)));

  archiveCurrentTrip();
  state = { trip: trip, weather: weather, items: items };
  dupOpenIdx = null;
  save();
  applyStateToPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// שורת השכפול: שדות תאריך, ויוצרת את הטיול לפי מה שהוזן
function renderDupForm(idx) {
  const form = el('form', { className: 'dup-form' });
  const startIn = el('input', { type: 'date', required: true });
  const endIn = el('input', { type: 'date', required: true });
  const todayISO = toISO(new Date());
  startIn.min = todayISO;
  endIn.min = todayISO;
  startIn.addEventListener('change', () => { endIn.min = startIn.value || todayISO; });

  const startBox = el('div'); startBox.append(el('label', null, 'מתאריך'), startIn);
  const endBox = el('div'); endBox.append(el('label', null, 'עד תאריך'), endIn);
  const dates = el('div', { className: 'row' }); dates.append(startBox, endBox);

  const err = el('div', { className: 'dup-error' });
  const go = el('button', { type: 'submit', className: 'primary' }, 'צור טיול עם התאריכים האלה');
  const cancel = el('button', { type: 'button', className: 'secondary' }, 'ביטול');
  cancel.addEventListener('click', () => { dupOpenIdx = null; renderPast(); });
  const btns = el('div', { className: 'actions' }); btns.append(go, cancel);

  form.append(dates, err, btns);
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = '';
    if (endIn.value < startIn.value) { err.textContent = 'תאריך החזרה חייב להיות אחרי תאריך היציאה.'; return; }
    go.disabled = true;
    go.textContent = 'בודק מזג אוויר...';
    try {
      await duplicatePastTrip(idx, startIn.value, endIn.value);
    } catch (e) {
      err.textContent = e.message || 'משהו השתבש, נסי שוב.';
      go.disabled = false;
      go.textContent = 'צור טיול עם התאריכים האלה';
    }
  });
  return form;
}

function deletePastTrip(idx) {
  if (!confirm('למחוק את הטיול הזה לצמיתות?')) return;
  const hist = loadHistory();
  hist.splice(idx, 1);
  dupOpenIdx = null;
  renameOpenIdx = null;
  saveHistory(hist);
  renderPast();
}

// ממלא את הטופס ואת התצוגה לפי state
function applyStateToPage() {
  nextId = state.items.reduce((m, i) => Math.max(m, i.id), 0) + 1;
  $('destination').value = state.trip.place;
  $('startDate').value = state.trip.start;
  $('endDate').value = state.trip.end;
  document.querySelectorAll('#activities input').forEach(i => { i.checked = state.trip.activities.includes(i.value); });
  renderWeather();
  renderList();
  renderPast();
}

function renderProgress() {
  const total = state.items.length;
  const done = state.items.filter(i => i.checked).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $('barFill').style.width = pct + '%';
  $('progressText').textContent = 'ארזת ' + done + ' מתוך ' + total + ' (' + pct + '%)';
}

/* =========================================================
   6. פעולות על הרשימה
   ========================================================= */

function toggleItem(id) {
  const it = state.items.find(i => i.id === id);
  it.checked = !it.checked;
  save();
  renderList();
  // אם הכול מסומן – חוגגים!
  if (state.items.length && state.items.every(i => i.checked)) launchConfetti();
}

function deleteItem(id) {
  state.items = state.items.filter(i => i.id !== id);
  save();
  renderList();
}

function addCustomItem(text) {
  state.items.push(makeItem(text, CUSTOM_CAT));
  save();
  renderList();
}

function shareWhatsApp() {
  const t = state.trip;
  let msg = '🧳 רשימת אריזה לטיול ל' + t.place + '\n';
  const groups = {};
  state.items.forEach(it => { (groups[it.cat] = groups[it.cat] || []).push(it); });
  Object.keys(groups).forEach(cat => {
    msg += '\n' + cat + '\n';
    groups[cat].forEach(it => { msg += (it.checked ? '✅ ' : '⬜ ') + it.text + '\n'; });
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

/* =========================================================
   7. קונפטי 🎉
   ========================================================= */

function launchConfetti() {
  const canvas = $('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#2f80ed', '#27ae60', '#f2c94c', '#eb5757', '#9b51e0'];
  const pieces = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.5,
    size: 6 + Math.random() * 6,
    speed: 2 + Math.random() * 4,
    drift: -1 + Math.random() * 2,
    color: colors[Math.floor(Math.random() * colors.length)]
  }));
  let frames = 0;
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    frames++;
    if (frames < 180) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  tick();
}

$('startDate').min = todayISO;
$('endDate').min = todayISO;
$('startDate').addEventListener('change', () => { $('endDate').min = $('startDate').value || todayISO; });

// בונה את הטיול והרשימה אחרי שיודעים בדיוק איזה מקום נבחר
async function buildTrip(place, start, end, activities) {
  const weather = await getWeather(place, start, end);
  const trip = { place: place.label, lat: place.lat, lon: place.lon, start: start, end: end, activities: activities };
  if (state && state.trip.name && state.trip.place === place.label) trip.name = state.trip.name;
  nextId = 1;
  state = { trip: trip, weather: weather, items: buildList(trip, weather) };
  save();
  renderWeather();
  renderList();
  $('weather').scrollIntoView({ behavior: 'smooth' });
}

function hideChoices() {
  $('placeChoices').classList.add('hidden');
  $('placeChoices').replaceChildren();
}

// כמה מקומות באותו שם – נותנים לבחור
function showChoices(places, onPick) {
  const box = $('placeChoices');
  box.replaceChildren(el('div', { className: 'hint' }, 'מצאתי כמה מקומות, איזה מהם?'));
  places.forEach(p => {
    const b = el('button', { type: 'button' }, p.label);
    if (p.population) b.append(' ', el('small', null, '· ' + p.population.toLocaleString('he-IL') + ' תושבים'));
    b.addEventListener('click', () => onPick(p));
    box.appendChild(b);
  });
  box.classList.remove('hidden');
}

$('destination').addEventListener('input', hideChoices);

$('tripForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('error').textContent = '';
  hideChoices();
  const name = $('destination').value.trim();
  const start = $('startDate').value;
  const end = $('endDate').value;
  if (end < start) { $('error').textContent = 'תאריך החזרה חייב להיות אחרי תאריך היציאה.'; return; }

  const activities = Array.from(document.querySelectorAll('#activities input:checked')).map(i => i.value);
  const btn = $('goBtn');
  const setBusy = (busy) => { btn.disabled = busy; btn.textContent = busy ? 'בודק מזג אוויר...' : 'בנה לי רשימה'; };
  setBusy(true);
  try {
    const places = await geocodeAll(name);
    if (places.length === 1) {
      await buildTrip(places[0], start, end, activities);
    } else {
      showChoices(places, async (place) => {
        hideChoices();
        $('error').textContent = '';
        setBusy(true);
        try {
          await buildTrip(place, $('startDate').value, $('endDate').value, activities);
        } catch (err) {
          $('error').textContent = err.message || 'משהו השתבש, נסי שוב.';
        } finally { setBusy(false); }
      });
    }
  } catch (err) {
    $('error').textContent = err.message || 'משהו השתבש, נסי שוב.';
  } finally {
    setBusy(false);
  }
});

$('addForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const text = $('newItem').value.trim();
  if (!text) return;
  addCustomItem(text);
  $('newItem').value = '';
});

$('shareBtn').addEventListener('click', shareWhatsApp);

$('resetBtn').addEventListener('click', () => {
  if (!confirm('לשמור את הטיול הזה בטיולים קודמים ולהתחיל טיול חדש?')) return;
  archiveCurrentTrip();
  dupOpenIdx = null;
  renameOpenIdx = null;
  renamingCurrent = false;
  state = null;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  $('destination').value = '';
  $('startDate').value = '';
  $('endDate').value = '';
  document.querySelectorAll('#activities input').forEach(i => { i.checked = false; });
  renderWeather();
  renderList();
  renderPast();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// בטעינת הדף – אם יש טיול שמור, מציגים אותו
state = load();
if (state && state.items) {
  applyStateToPage();
} else {
  state = null;
  renderPast();
}

// כשהאפליקציה רצה בתוך מסגרת של Streamlit – מתאימים את גובה המסגרת לתוכן,
// כדי שלא תהיה גלילה כפולה (אחת של הדף ואחת של המסגרת)
(function autoResizeFrame() {
  const frame = window.frameElement;
  if (!frame) return;
  const fit = () => { frame.style.height = document.body.scrollHeight + 'px'; };
  try {
    new ResizeObserver(fit).observe(document.body);
    fit();
  } catch (e) {}
})();
</script>
</body>
