<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackPal – Executive Smart Packing</title>
<link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32.png">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     1. פלטת צבעים יוקרתית עתידנית (Cyber Luxe & Executive)
     ========================================================= */
  :root {
    /* --- Light Mode: Executive Aviation Luxe --- */
    --bg-main: #f4f1ea;
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-hover: #ffffff;
    --text-main: #0b132b;
    --text-muted: #64748b;
    --accent-gold: #d97706;
    --accent-blue: #0284c7;
    --accent-dark: #0f172a;
    --ok-green: #059669;
    --border-color: rgba(15, 23, 42, 0.1);
    --soft-bg: #eae6df;
    --shadow-luxe: 0 20px 40px rgba(15, 23, 42, 0.07);
    --glow-effect: rgba(217, 119, 6, 0.15);
    --font-base: 'Heebo', system-ui, sans-serif;
    --font-code: 'JetBrains Mono', monospace;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    /* --- Dark Mode: Cyber Aviation Neon --- */
    --bg-main: #05070d;
    --card-bg: rgba(13, 19, 33, 0.75);
    --card-hover: rgba(21, 31, 53, 0.85);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-gold: #f59e0b;
    --accent-blue: #38bdf8;
    --accent-dark: #0284c7;
    --ok-green: #10b981;
    --border-color: rgba(245, 158, 11, 0.2);
    --soft-bg: rgba(21, 31, 53, 0.5);
    --shadow-luxe: 0 25px 50px rgba(0, 0, 0, 0.7);
    --glow-effect: rgba(56, 189, 248, 0.25);
    color-scheme: dark;
  }

  /* =========================================================
     2. Reset & Layout
     ========================================================= */
  * { box-sizing: border-box; }
  html { font-size: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-base);
    background: var(--bg-main);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.04) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.05) 0%, transparent 45%);
    background-attachment: fixed;
    color: var(--text-main);
    line-height: 1.5;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  .hidden { display: none !important; }

  /* =========================================================
     3. Executive Boarding Pass Header
     ========================================================= */
  .hero-pass {
    position: relative;
    overflow: hidden;
    margin: 10px 0 24px;
    padding: 28px 26px 22px;
    border-radius: 28px;
    background: linear-gradient(135deg, #090d16 0%, #111827 100%);
    color: #ffffff;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-luxe), 0 0 30px var(--glow-effect);
    backdrop-filter: blur(20px);
  }

  .pass-header {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-code);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent-gold);
    text-transform: uppercase;
    direction: ltr;
    margin-bottom: 14px;
  }

  .hero-pass h1 {
    margin: 0;
    font-size: 2.4rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-pass h1 small {
    display: block;
    margin-top: 6px;
    font-size: 0.95rem;
    font-weight: 400;
    color: #94a3b8;
    -webkit-text-fill-color: #94a3b8;
  }

  .pass-flight-path {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 22px -26px -22px;
    padding: 16px 26px;
    background: rgba(0, 0, 0, 0.3);
    border-top: 1px dashed var(--border-color);
    direction: ltr;
  }

  .flight-code {
    font-family: var(--font-code);
    font-weight: 800;
    font-size: 1.5rem;
    color: #ffffff;
    letter-spacing: 2px;
  }

  .flight-line {
    position: relative;
    flex: 1;
    height: 2px;
    margin: 0 20px;
    background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
  }

  .flight-plane {
    position: absolute;
    top: -12px;
    left: 0;
    font-style: normal;
    font-size: 1.3rem;
    animation: fly 4s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 10px var(--accent-blue));
  }

  @keyframes fly {
    0% { left: 0%; transform: rotate(-90deg) scaleX(-1); }
    100% { left: calc(100% - 1.5rem); transform: rotate(-90deg) scaleX(-1); }
  }

  /* =========================================================
     4. Luxury Cards & Interactive UI
     ========================================================= */
  .luxe-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 22px;
    padding: 24px;
    margin: 18px 0;
    box-shadow: var(--shadow-luxe);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .luxe-card:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 14px;
    padding: 14px 20px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button:hover { transform: translateY(-2px); filter: brightness(1.08); }
  button:active { transform: translateY(0) scale(0.98); }

  .btn-gold {
    background: linear-gradient(135deg, var(--accent-gold), #b45309);
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(217, 119, 6, 0.3);
    width: 100%;
  }

  .btn-soft {
    background: var(--soft-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
  }

  /* Items Styling */
  .pack-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border-radius: 16px;
    background: var(--soft-bg);
    border: 1px solid var(--border-color);
    transition: all 0.25s ease;
  }

  .pack-item:hover {
    border-color: var(--accent-gold);
    transform: translateX(-4px);
  }

  .pack-item input[type=checkbox] {
    width: 24px;
    height: 24px;
    accent-color: var(--ok-green);
    cursor: pointer;
  }

  .pack-item.checked {
    opacity: 0.55;
    background: rgba(16, 185, 129, 0.05);
  }

  .pack-item.checked .item-name {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  /* Navigation Bar */
  .top-tools {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 99;
  }
</style>
</head>
<body>

<div class="top-tools">
  <button type="button" class="btn-soft" id="themeToggle">🌙 / ☀️</button>
</div>

<main>
  <!-- Executive Boarding Pass Header -->
  <header class="hero-pass">
    <div class="pass-header">
      <span>EXECUTIVE PASS</span>
      <span>PACKPAL · CYBER LUXE</span>
    </div>
    <h1>🧳 PackPal <small>מערכת אריזה חכמה לפי תחזית מזג האוויר ופעילויות</small></h1>
    <div class="pass-flight-path">
      <span class="flight-code">TLV</span>
      <div class="flight-line"><i class="flight-plane">✈️</i></div>
      <span class="flight-code">DEST</span>
    </div>
  </header>

  <!-- Main Luxury Card -->
  <section class="luxe-card">
    <h2>ברוכה הבאה לעיצוב החדש! ✈️</h2>
    <p>מהפך הושלם בהצלחה: האתר כעת מעוצב בקו היוקרתי והנקי ביותר לשני המצבים (Executive Light & Cyber Dark).</p>

      <input type="checkbox" id="sample1">
      <label for="sample
