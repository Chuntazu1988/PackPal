<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackPal 2.0 – Cyber Aviation Luxe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;500;700;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #040814;
    --panel-bg: rgba(13, 20, 36, 0.75);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --gold: #f59e0b;
    --text: #f8fafc;
    --text-sub: #94a3b8;
    --border: rgba(56, 189, 248, 0.25);
    --font: 'Heebo', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  [data-theme="light"] {
    --bg: #f4f0ea;
    --panel-bg: rgba(255, 255, 255, 0.88);
    --accent: #0284c7;
    --accent-glow: rgba(2, 132, 199, 0.2);
    --gold: #d97706;
    --text: #0f172a;
    --text-sub: #64748b;
    --border: rgba(15, 23, 42, 0.15);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .main-card {
    width: 100%;
    max-width: 580px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 36px 28px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 35px var(--accent-glow);
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .badge {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 2.5px;
    color: var(--gold);
    text-transform: uppercase;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.3);
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
  }

  .theme-toggle {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
  }

  h1 {
    font-size: 2.6rem;
    font-weight: 900;
    margin: 0 0 8px;
    line-height: 1.1;
  }

  p.desc {
    color: var(--text-sub);
    font-size: 1.05rem;
    margin-top: 0;
    margin-bottom: 28px;
  }

  /* Boarding Pass Visual */
  .ticket {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: ltr;
  }

  .code {
    font-family: var(--font-mono);
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--text);
  }

  .line-wrap {
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 0 20px;
    position: relative;
  }

  .plane {
    position: absolute;
    top: -11px;
    left: 50%;
    transform: translateX(-50%) rotate(90deg);
    font-size: 1.2rem;
    filter: drop-shadow(0 0 8px var(--accent));
  }

  .main-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #0284c7);
    color: #040814;
    font-size: 1.15rem;
    font-weight: 900;
    padding: 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 10px 25px var(--accent-glow);
    transition: all 0.3s ease;
  }

  .main-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
  }
</style>
</head>
<body>

<div class="main-card">
  <div class="top-row">
    <span class="badge">NEXT-GEN PACKPAL</span>
    <button class="theme-toggle" id="toggleTheme">🌙 / ☀️</button>
  </div>

  <h1>PackPal 2.0 ✈️</h1>
  <p class="desc">מערכת תכנון הטיסות והאריזה החכמה בלוק העתידני החדש.</p>

  <div class="ticket">
    <div class="code">TLV</div>
    <div class="line-wrap"><span class="plane">✈️</span></div>
    <div class="code">YOU</div>
  </div>

  <button class="main-btn" onclick="alert('ברוכה הבאה לעיצוב החדש!')">התחל תכנון טיסה 🚀</button>
</div>

<script>
  const btn = document.getElementById('toggleTheme');
  let isDark = true;
  btn.addEventListener('click', () => {
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  });
</script>
</body>
</html>
