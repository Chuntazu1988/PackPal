<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackPal – Next-Gen Aviation Luxe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #030712;
    --card-bg: rgba(17, 24, 39, 0.7);
    --border: rgba(56, 189, 248, 0.2);
    --text: #f9fafb;
    --muted: #9ca3af;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --gold: #fbbf24;
    --font: 'Heebo', sans-serif;
    --font-head: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.06) 0%, transparent 40%);
  }

  .app-container {
    width: 100%;
    max-width: 540px;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px var(--accent-glow);
    animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-head);
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(251, 191, 36, 0.1);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(251, 191, 36, 0.2);
    margin-bottom: 20px;
  }

  h1 {
    font-family: var(--font-head);
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0 0 10px 0;
    line-height: 1.1;
    background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p {
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 30px;
  }

  .flight-card {
    background: rgba(3, 7, 18, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .airport {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
  }

  .flight-visual {
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 0 20px;
    position: relative;
  }

  .plane-icon {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%) rotate(90deg);
    font-size: 1.2rem;
    filter: drop-shadow(0 0 8px var(--accent));
  }

  .action-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #0284c7);
    color: #030712;
    font-family: var(--font-head);
    font-size: 1.1rem;
    font-weight: 700;
    padding: 18px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 10px 25px var(--accent-glow);
    transition: all 0.3s ease;
  }

  .action-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(56, 189, 248, 0.5);
    filter: brightness(1.1);
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="brand-badge">⚡ Next-Gen Experience</div>
  <h1>PackPal 2.0</h1>
  <p>מערכת הניטור והאריזה העתידנית שלך לטיסות מנהלים ויעדים בעולם.</p>

  <div class="flight-card">
    <div>
      <div style="font-size: 0.8rem; color: var(--muted);">מוצא</div>
      <div class="airport">TLV</div>
    </div>
    <div class="flight-visual"><span class="plane-icon">✈️</span></div>
    <div style="text-align: left;">
      <div style="font-size: 0.8rem; color: var(--muted);">יעד</div>
      <div class="airport">SFO</div>
    </div>
  </div>

  <button class="action-btn" onclick="alert('ברוכה הבאה לעיצוב החדש!')">התחל תכנון טיסה חכם 🚀</button>
</div>

</body>
</html>
