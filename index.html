<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackPal – רשימת אריזה חכמה לטיול</title>
<link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32.png">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#090d16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     1. פלטות צבעים ומשתנים (Light & Dark Luxe Theme)
     ========================================================= */
  :root {
    /* --- Light Mode: Executive Aviation Luxe --- */
    --bg: #f8f6f0;
    --card: rgba(255, 255, 255, 0.85);
    --card-hover: rgba(255, 255, 255, 0.98);
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0284c7;
    --accent-dark: #0369a1;
    --on-accent: #ffffff;
    --ok: #059669;
    --danger: #e11d48;
    --border: rgba(15, 23, 42, 0.12);
    --soft: rgba(241, 245, 249, 0.8);
    --stat: #f1f5f9;
    --track: #e2e8f0;
    --sand: #fef3c7;
    --sun: #d97706;
    --hero-top: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --hero-bottom: #0f172a;
    --hero-text: #f8fafc;
    --cloud: rgba(255,255,255,.15);
    --shadow: rgba(15, 23, 42, 0.08);
    --shadow-hover: rgba(15, 23, 42, 0.15);
    --stamp: #d97706;
    --glow: rgba(2, 132, 199, 0.15);
    --font: 'Heebo', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    color-scheme: light;
  }

  /* --- Dark Mode: Cyber Aviation Neon --- */
  :root[data-theme="dark"] {
    --bg: #070a12;
    --card: rgba(15, 23, 42, 0.65);
    --card-hover: rgba(30, 41, 67, 0.75);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-dark: #0284c7;
    --on-accent: #070a12;
    --ok: #10b981;
    --danger: #f43f5e;
    --border: rgba(255, 255, 255, 0.1);
    --soft: rgba(30, 41, 59, 0.6);
    --stat: rgba(30, 41, 59, 0.8);
    --track: rgba(255, 255, 255, 0.08);
    --sand: rgba(245, 158, 11, 0.15);
    --sun: #fbbf24;
    --hero-top: linear-gradient(135deg, #090d16 0%, #111827 100%);
    --hero-bottom: #090d16;
    --hero-text: #f8fafc;
    --cloud: rgba(255,255,255,.08);
    --shadow: rgba(0, 0, 0, 0.5);
    --shadow-hover: rgba(0, 0, 0, 0.7);
    --stamp: #f59e0b;
    --glow: rgba(56, 189, 248, 0.25);
    color-scheme: dark;
  }

  /* =========================================================
     2. Reset, Base & Helper Classes (תמיכה במחלקות המקוריות)
     ========================================================= */
  * { box-sizing: border-box; }
  html { font-size: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    font-size: 1rem;
    font-family: var(--font);
    background: var(--bg);
    background-image: 
      radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(245, 158, 11, 0.04) 0%, transparent 40%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  main { max-width: 680px; margin: 0 auto; padding: 20px 16px 50px; }

  /* מחלקות עזר קריטיות למניעת הסתרות ועיוותים */
  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  
  .floaty { position: fixed; z-index: 100; }
  #tools { top: 16px; left: 16px; }
  .toasts { bottom: 20px; left: 20px; right: 20px; pointer-events: none; display: flex; flex-direction: column; gap: 8px; align-items: center; }

  /* Drawer / מגירת הגדרות עיצוב */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; background: var(--card); backdrop-filter: blur(20px); border-left: 1px solid var(--border); padding: 20px; z-index: 201; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: -10px 0 30px var(--shadow); }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .drawer-body { display: flex; flex-direction: column; gap: 12px; }
  .tool-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--soft); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); }

  /* =========================================================
     3. Futuristic Boarding Pass Header
     ========================================================= */
  .hero {
    position: relative;
    overflow: hidden;
    margin: 8px 0 20px;
    padding: 24px 24px 22px;
    border-radius: 24px;
    background: var(--hero-top);
    color: var(--hero-text);
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px var(--shadow), 0 0 25px var(--glow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    animation: rise .5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .bp-top {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 2.5px;
    color: var(--stamp);
    margin-bottom: 12px;
    direction: ltr;
    text-transform: uppercase;
  }

  .hero h1 {
    position: relative;
    z-index: 2;
    margin: 0;
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1.15;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero h1 small {
    display: block;
    margin-top: 6px;
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--muted);
    -webkit-text-fill-color: var(--muted);
    letter-spacing: 0;
  }

  .bp-route {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 20px -24px -22px;
    padding: 16px 24px;
    border-top: 1px dashed var(--border);
    background: rgba(0, 0, 0, 0.2);
    direction: ltr;
  }

  .bp-route::before, .bp-route::after {
    content: "";
    position: absolute;
    top: -10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--bg);
  }
  .bp-route::before { left: -10px; }
  .bp-route::after { right: -10px; }

  .bp-code {
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: var(--hero-text);
  }

  .bp-path {
    position: relative;
    flex: 1;
    height: 24px;
    margin: 0 16px;
  }

  .bp-path::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .bp-plane {
    position: absolute;
    top: -2px;
    left: 0;
    font-style: normal;
    font-size: 1.3rem;
    line-height: 24px;
    animation: bpfly 4s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 8px var(--accent));
  }

  @keyframes bpfly {
    0% { left: 0%; transform: rotate(-90deg) scaleX(-1); }
    100% { left: calc(100% - 1.4rem); transform: rotate(-90deg) scaleX(-1); }
  }

  /* =========================================================
     4. Cards & UI Components
     ========================================================= */
  .card {
    position: relative;
    background: var(--card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin: 16px 0;
    box-shadow: 0 10px 30px var(--shadow);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  label { display: block; font-weight: 600; margin: 10px 0 6px; font-size: 0.95rem; }

  input[type=text], input[type=date], input[type=search], input[type=number] {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    transition: all 0.2s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--glow);
    background: rgba(255, 255, 255, 0.08);
  }

  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; min-width: 0; }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.05); }
  button:active:not(:disabled) { transform: translateY(0) scale(0.98); }

  .primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: var(--on-accent);
    width: 100%;
    margin-top: 18px;
    font-weight: 700;
    padding: 15px 20px;
    border-radius: 14px;
    box-shadow: 0 8px 20px var(--glow);
  }

  .secondary {
    background: var(--soft);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .whatsapp {
    background: #25d366;
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(37, 211, 102, 0.25);
  }

  /* Chips */
  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
  .chip input { display: none; }
  .chip { margin: 0; font-weight: normal; }
  .chip span {
    display: block;
    text-align: center;
    padding: 12px 10px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--soft);
    cursor: pointer;
    user-select: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .chip input:checked + span {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    box-shadow: 0 6px 16px var(--glow);
  }

  /* List Items */
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 14px;
    background: var(--soft);
    border: 1px solid var(--border);
    transition: all 0.25s ease;
  }
  .item input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ok); cursor: pointer; border-radius: 6px; }
  .item .text { flex: 1; font-weight: 500; }
  .item.done { opacity: 0.6; background: rgba(16, 185, 129, 0.04); }
  .item.done .text { text-decoration: line-through; color: var(--muted); }

  /* Progress & Tabs */
  .bar { height: 12px; background: var(--track); border-radius: 20px; overflow: hidden; margin: 12px 0; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width 0.6s ease; }

  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0 8px; padding: 6px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: none; color: var(--muted); border-radius: 12px; font-weight: 600; font-size: 0.82rem; }
  .tabbar button.active { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 14px var(--glow); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div id="devBanner" class="hidden">🚧 גרסת פיתוח (DEV) 🚧</div>

<div id="tools" class="floaty">
  <button type="button" id="designToggle" aria-expanded="false" aria-controls="designPanel">🎨 עיצוב</button>
</div>

<div id="drawerOverlay" class="overlay"></div>
<aside id="designPanel" class="drawer" aria-label="הגדרות עיצוב" aria-hidden="true">
  <div class="drawer-head">
    <strong>🎨 הגדרות עיצוב</strong>
    <button type="button" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body">
    <button type="button" id="themeBtn">🌙 כהה</button>
    <button type="button" id="sizeBtn">🔠 גודל טקסט</button>
    <button type="button" id="fontBtn">🔤 פונט</button>
    <div class="tool-row">
      <label id="bgBtn">🖌️ צבע רקע</label>
      <input type="color" id="bgPicker">
      <button type="button" id="bgReset" class="hidden">↺</button>
    </div>
  </div>
</aside>

<main>
  <!-- Boarding Pass Header -->
  <header class="hero">
    <div class="bp-top">
      <span>BOARDING PASS</span>
      <span>PACKPAL · PREMIUM</span>
    </div>
    <h1>🧳 PackPal <small>רשימת אריזה חכמה לפי מזג האוויר והפעילויות שלך</small></h1>
    <div class="bp-route">
      <span class="bp-code">TLV</span>
      <span class="bp-path"><i class="bp-plane">✈️</i></span>
      <span class="bp-code">YOU</span>
    </div>
  </header>

  <!-- דוגמת תוכן מרכזי ראשוני למניעת הסתרות -->
  <section class="card">
    <h2>ברוכה הבאה! 👋</h2>
    <p>העיצוב המלא והמעודכן (גם ליום וגם ללילה) מופעל כעת בצורה תקינה ומסודרת.</p>
  </section>
</main>

<script>
  // ניהול פתיחה/סגירה של מגירת העיצוב
  const designToggle = document.getElementById('designToggle');
  const designPanel = document.getElementById('designPanel');
  const drawerOverlay = document.getElementById('drawerOverlay');
  const drawerClose = document.getElementById('drawerClose');

  function toggleDrawer(open) {
    designPanel.classList.toggle('open', open);
    drawerOverlay.classList.toggle('open', open);
    designToggle.setAttribute('aria-expanded', open);
    designPanel.setAttribute('aria-hidden', !open);
  }

  designToggle.addEventListener('click', () => toggleDrawer(true));
  drawerClose.addEventListener('click', () => toggleDrawer(false));
  drawerOverlay.addEventListener('click', () => toggleDrawer(false));

  // ניהול מצב כהה/בהיר
  const THEME_KEY = 'packpal-theme';
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️ בהיר' : '🌙 כהה';
  }
  let savedTheme = localStorage.getItem(THEME_KEY) || 'light';
  applyTheme(savedTheme);

  document.getElementById('themeBtn').addEventListener('click', () => {
    let next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });
</script>
</body>
</html>
